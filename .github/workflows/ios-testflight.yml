name: iOS Build & TestFlight Deployment

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build iOS App & TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Sync Capacitor iOS
        run: |
          cd client
          npx cap sync ios

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS Simulator App (Zero Certificate Required)
        run: |
          cd client/ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO
          
          cd build/derivedData/Build/Products/Release-iphonesimulator
          zip -r Auralicht-iOS-Simulator.zip App.app

      - name: Upload iOS Simulator Build (Instant Testing / Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: Auralicht-iOS-Simulator-App
          path: client/ios/App/build/derivedData/Build/Products/Release-iphonesimulator/Auralicht-iOS-Simulator.zip

      - name: Check for Apple Developer Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ] && [ -n "${{ secrets.ASC_KEY_ID }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "Apple Developer Secrets found. Proceeding with TestFlight deployment."
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "Notice: Apple Developer Secrets not yet configured in GitHub. Simulator build succeeded and is available in Artifacts."
          fi

      - name: Install Apple Certificates & Provisioning Profile
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build & Archive iOS Project for Device
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          cd client/ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual

      - name: Export IPA
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          cd client/ios/App
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ipa

      - name: Upload IPA Artifact
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Auralicht-iOS-IPA
          path: client/ios/App/build/ipa/*.ipa

      - name: Upload to App Store Connect / TestFlight
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          
          xcrun altool --upload-app \
            --type ios \
            --file client/ios/App/build/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
